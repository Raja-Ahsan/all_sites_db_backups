server {
    server_name amanda-walk.sitestaginglink.com;

    location / {
        proxy_pass http://127.0.0.1:1207;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /uploads/ {
        alias /var/www/amanda-walk/public/uploads/;
        autoindex on;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/amanda-walk.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/amanda-walk.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = amanda-walk.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name amanda-walk.sitestaginglink.com;
    listen 80;
    return 404; # managed by Certbot


}