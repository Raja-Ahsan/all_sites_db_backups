# ===============================
# HTTPS SERVER
# ===============================
server {
    server_name crm.sitestaginglink.com;

    # React build
    root /var/www/crm/client/build;
    index index.html;

    # -------------------------------
    # API → Node.js (PORT 5000)
    # -------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # -------------------------------
    # Uploaded files (Express static)
    # -------------------------------
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------
    # React SPA fallback
    # -------------------------------
    location / {
        try_files $uri /index.html;
    }

    # -------------------------------
    # SSL (Certbot)
    # -------------------------------
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/crm.sitestaginglink.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.sitestaginglink.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# ===============================
# HTTP → HTTPS REDIRECT
# ===============================
server {
    listen 80;
    server_name crm.sitestaginglink.com;
    return 301 https://$host$request_uri;
}
