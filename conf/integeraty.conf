server {
    server_name integrity-development.sitestaginglink.com;

    root /var/www/html/integrity-dev/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
    include snippets/fastcgi-php.conf;
    fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    # include fastcgi_params;   <-- is line ko hata do ya comment kar do
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/integrity-development.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/integrity-development.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = integrity-development.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    }

    server_name integrity-development.sitestaginglink.com;
    listen 80;
    return 404;
}
