server {
    server_name libertywebstudio.sitestaginglink.com;

    root /var/www/html/liberty-web-studios/dist;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/libertywebstudio.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/libertywebstudio.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = libertywebstudio.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name libertywebstudio.sitestaginglink.com;
    return 404; # managed by Certbot


}
