server {
    server_name portal.lana-amawi.com;

    root /var/www/html/lana-amawi-coaching-portal/public;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }
    location /storage/ {
        alias /var/www/html/lana-amawi-coaching-portal/storage/app/public/;
        access_log off;
        log_not_found off;
        try_files $uri $uri/ =404;
    }
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }
    location ~ /\.ht {
        deny all;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/portal.lana-amawi.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/portal.lana-amawi.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = portal.lana-amawi.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name portal.lana-amawi.com;
    listen 80;
    return 404; # managed by Certbot


}