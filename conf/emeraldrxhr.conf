server {
    server_name emeraldsrxhr.sitestaginglink.com;

    location / {
        proxy_pass http://127.0.0.1:1206;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1205/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /uploads/ {
        alias /var/www/emeraldrx-hr/backend/uploads/;
        autoindex off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/emeraldsrxhr.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/emeraldsrxhr.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = emeraldsrxhr.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name emeraldsrxhr.sitestaginglink.com;
    return 404;


}
