server {
    listen 80;
    server_name build-freedom.ai www.build-freedom.ai;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name build-freedom.ai www.build-freedom.ai;

    ssl_certificate /etc/letsencrypt/live/build-freedom.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/build-freedom.ai/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Required headers for WebContainers / SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;

    # Serve React frontend build
    root /var/www/frdm-ai/dist;
    index index.html;

    # Increase client body size for file uploads (10MB to match multer limit)
    client_max_body_size 10M;

    # WebSocket / Socket.IO proxy (must come BEFORE /api/)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable buffering
        proxy_buffering off;
        proxy_cache off;
        
        # Timeouts for WebSocket
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Proxy uploaded files to backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cache uploaded images
        proxy_cache_valid 200 1d;
        expires 1d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy ALL backend API requests to Node.js
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;

        # Preserve headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Support streaming / SSE / WebSocket upgrades
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Critical for SSE streaming (send, fix, cost-stream endpoints)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;

        # Enable chunked transfer encoding for streaming
        chunked_transfer_encoding on;

        # Prevent nginx from adding extra headers that break SSE
        proxy_set_header X-Accel-Buffering no;
    }

    # Serve frontend (must be LAST to catch all remaining routes)
    location / {
        try_files $uri /index.html;
    }
}
