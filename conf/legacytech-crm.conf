server {
    server_name logicworkscrm.sitestaginglink.com;

    root /var/www/legacytech-crm/dist;  # Adjust if your website files are elsewhere
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        
	proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    	proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/logicworkscrm.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/logicworkscrm.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = logicworkscrm.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name logicworkscrm.sitestaginglink.com;
    return 404; # managed by Certbot


}
