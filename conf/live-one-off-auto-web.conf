# Redirect www → non-www
server {
    listen 80;
    server_name www.oneoffautos.com;
    return 301 https://oneoffautos.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.oneoffautos.com;

    ssl_certificate /etc/letsencrypt/live/oneoffautos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneoffautos.com/privkey.pem;

    return 301 https://oneoffautos.com$request_uri;
}

# Main Domain (non-www)
server {
    listen 443 ssl http2;
    server_name oneoffautos.com;

    ssl_certificate /etc/letsencrypt/live/oneoffautos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oneoffautos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/one-off-auto-web/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|mp4|webm)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location ~ /\.ht {
        deny all;
    }
}

# HTTP → HTTPS Redirect (non-www only)
server {
    listen 80;
    server_name oneoffautos.com;
    return 301 https://oneoffautos.com$request_uri;
}
