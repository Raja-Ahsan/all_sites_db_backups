server {
    server_name greatamerican.ai;

    root /var/www/html/greatamericanaI/dist;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/greatamerican.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/greatamerican.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = greatamerican.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name greatamerican.ai;
    listen 80;
    return 404; # managed by Certbot


}