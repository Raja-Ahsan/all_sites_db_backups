server {
    server_name pos.cakeit.us;

    root /var/www/html/cakeit/public;

add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

location / {
        try_files $uri $uri/ /index.php?$args;
    }
location /storage/ {
    alias /var/www/html/cakeit/storage/app/public/;
    access_log off;
    log_not_found off;
    try_files $uri $uri/ =404;
}
    location ~ \.php$ {
    fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pos.cakeit.us/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pos.cakeit.us/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = pos.cakeit.us) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name pos.cakeit.us;
    listen 80;
    return 404; # managed by Certbot


}