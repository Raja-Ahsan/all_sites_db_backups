
server {
    server_name fitnex.sitestaginglink.com;

    root /var/www/html/fitnex/public;

add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php index.html;

location / {
        try_files $uri $uri/ /index.php?$args;
    }
location /storage/ {
    alias /var/www/html/fitnex/storage/app/public/;
    access_log off;
    log_not_found off;
    try_files $uri $uri/ =404;
}
    location ~ \.php$ {
fastcgi_pass 127.0.0.1:17001;
include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_index index.php;
    }

    location ~ /\.ht {
        deny all;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/fitnex.sitestaginglink.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/fitnex.sitestaginglink.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
    

server {
    if ($host = fitnex.sitestaginglink.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name fitnex.sitestaginglink.com;
    listen 80;
    return 404; # managed by Certbot


}